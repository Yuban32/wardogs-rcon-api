name: Publish

on:
  push:
    tags: ['v*']
  # A manual run builds, tests and packs without publishing — the publish step
  # below is gated on a tag push. There is deliberately no input to override
  # that: a manual run checks out a branch, not a tag, so the tag/version check
  # could not run, and an off-tag publish would be the one release this workflow
  # exists to prevent.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Required for npm provenance: the OIDC token is what proves the tarball
      # was built from this commit by this workflow, rather than uploaded from
      # a laptop.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      # Fail seconds in, rather than after the full suite. npm's own error for a
      # missing credential is a bare `ENEEDAUTH` raised by the registry at the
      # very end of the run, which reads like a bad token instead of a secret
      # that was never created — the two need different fixes.
      - name: Check the NPM_TOKEN secret is present
        if: github.event_name == 'push'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN is missing or empty. Create a granular access token with bypass-2FA enabled and add it as a repository secret."
            exit 1
          fi
          echo "NPM_TOKEN is present"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      # The tag and the manifest must agree. Publishing 0.2.0 from a v0.1.0 tag
      # is unrecoverable — npm will not let the version be reused — so it is
      # checked before anything is built.
      - name: Verify the tag matches package.json
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag is $TAG_VERSION but package.json says $PKG_VERSION."
            echo "Bump package.json and src/version.ts, then re-tag."
            exit 1
          fi
          echo "tag and manifest agree on $PKG_VERSION"

      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run lint:pkg
      - run: npm run check:changelog

      # Inspect what would actually ship, before shipping it. `files` mistakes
      # are invisible until a user installs and the import fails.
      - name: Show tarball contents
        run: npm pack --dry-run

      - name: Publish to npm
        if: github.event_name == 'push'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
